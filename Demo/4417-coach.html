<style>

main{max-width:860px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0a1018ee;backdrop-filter:blur(6px);z-index:5}
.brand{display:flex;gap:7px;align-items:center}.logo{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;font-weight:900;border-radius:8px;padding:2px 7px;box-shadow:0 0 12px #38bdf866}

button,select{background:#162231;border:1px solid var(--line);border-radius:10px;min-height:42px;padding:6px 12px;cursor:pointer}

<script>
function createPhysics(){
 'use strict';
 const W=2.84,H=1.42,R=.03075,D=2*R,G=9.81;
 const BASE=Object.freeze({slide:.20,roll:.012,railE:.82,railMu:.14,ballE:.96,spinDecay:.45,railRoll:.9});
 const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));
 function validate(p){
  return Array.isArray(p)&&p.length===3&&p.every(a=>a&&Number.isFinite(a.x)&&Number.isFinite(a.y)&&a.x>=R+.001&&a.x<=W-R-.001&&a.y>=R+.001&&a.y<=H-R-.001)&&p.every((a,i)=>p.every((b,j)=>i===j||Math.hypot(a.x-b.x,a.y-b.y)>=D+.005));
 }
 // Same chronological rule as v3.6: freeze at SECOND DISTINCT object, not later rails.
 function ruleAtSecond(events){
  let cushions=0;const hit=new Set();
  for(const e of events){
   if(e.type==='cushion')cushions++;
   if(e.type==='ball'){
    hit.add(e.target);
    if(hit.size===2)return {score:cushions>=3,cushions,objects:[...hit],t:e.t};
   }
  }

/* ---------- access: code + PIN -> file name hash, AES-GCM decrypt ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(s){const h=await crypto.subtle.digest('SHA-256',enc.encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function fileId(code,pin){return (await sha('3q:'+code.trim().toUpperCase()+':'+pin.trim())).slice(0,24);}
async function decrypt(box,code,pin){
 const km=await crypto.subtle.importKey('raw',enc.encode(code.trim().toUpperCase()+':'+pin.trim()),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(box.salt),iterations:box.it||150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(box.iv)},key,b64d(box.ct));return JSON.parse(dec.decode(pt));}
async function login(code,pin,remember){
 $('lgMsg').textContent='불러오는 중…';
 try{const id=await fileId(code,pin);const r=await fetch(`./members/${id}.json`,{cache:'no-cache'});
  if(!r.ok)throw new Error(r.status===404?'회원코드나 PIN이 맞지 않아요.':'서버 응답 '+r.status);
  const d=await decrypt(await r.json(),code,pin);
  try{if(remember)localStorage.setItem('3q-member',JSON.stringify({code,pin}));else localStorage.removeItem('3q-member');}catch(e){}
  start(d);}
 catch(e){$('lgMsg').textContent=e.name==='OperationError'?'회원코드나 PIN이 맞지 않아요.':(e.message||'불러오지 못했어요.');}
}

 for(let k=1;k<n-1;k++){const p=pt(k),q0=pt(k-1),q1=pt(k+1);for(let w=0;w<4;w++){const ax=w>>1,hi=w&1,ds=v=>hi?L[ax]-R-v[ax]:v[ax]-R,d=ds(p);
  if(d<.05&&d<=ds(q0)&&d<ds(q1)&&Math.max(ds(q0),ds(q1))-d>.008&&!(lw===w&&k-last<3)){o.push({t:k/fps,x:p[0],y:p[1]});last=k;lw=w;}}}return o;}
// first contact with each object ball in the recorded track: where the cue ball is one ball-width from it as it starts to move
function actHit(a){const T=a.tr;if(!T)return [];const fps=T.fps,n=T.d.length/6,R=P.R,c=a.cue,f=(k,b)=>[T.d[k*6+b*2]/100,T.d[k*6+b*2+1]/100],o=[];
 for(const b of [0,1,2]){if(b===c)continue;const p0=f(0,b);let k=1;while(k<n&&Math.hypot(f(k,b)[0]-p0[0],f(k,b)[1]-p0[1])<.012)k++;if(k>=n)continue;
  let best=null,bd=1e9;for(let j=Math.max(0,k-3)*8;j<=k*8;j++){const u=j/8,i0=Math.floor(u),fr=u-i0,A=f(i0,c),B=f(Math.min(n-1,i0+1),c),q=[A[0]+(B[0]-A[0])*fr,A[1]+(B[1]-A[1])*fr],d=Math.abs(Math.hypot(q[0]-p0[0],q[1]-p0[1])-2*R);if(d<bd){bd=d;best={t:u/fps,x:q[0],y:q[1],b};}}
  if(best&&bd<.04)o.push(best);}
 return o.sort((x,y)=>x.t-y.t);}
// dashed ring where the cue ball met an object ball (same look as the replay file)
function ring(x,y,col){const c=S2(x,y);cx.save();cx.strokeStyle=col;cx.lineWidth=2*DPR;cx.setLineDash([3*DPR,3*DPR]);cx.beginPath();cx.arc(c.x,c.y,BR()*2,0,7);cx.stroke();cx.restore();}
// dashed aim line ahead of the cue ball (same look as the replay file)
function aim(p,ang){const c=S2(p[0],p[1]),dx=Math.cos(ang),dy=Math.sin(ang),r=P.R*1.4*SC,L=.42*SC;cx.save();cx.globalAlpha=.42;cx.strokeStyle='#fff';cx.lineWidth=1.1*DPR;cx.setLineDash([4*DPR,5*DPR]);cx.beginPath();cx.moveTo(c.x+dx*r,c.y+dy*r);cx.lineTo(c.x+dx*L,c.y+dy*L);cx.stroke();cx.restore();}
// cushion contact: a triangle in the cushion band, tip on the cloth edge, pointing into the table
function point(x,y,col){const pal=CLOTH[CLOTH_SEL]||G.pal||{},d=[x,2.84-x,y,1.42-y],w=d.indexOf(Math.min(...d)),h=Math.max((pal.cuW||.05)*SC*1.05,7*DPR),hw=h*.62;
 let px=clamp(x,0,2.84),py=clamp(y,0,1.42);if(w===0)px=0;else if(w===1)px=2.84;else if(w===2)py=0;else py=1.42;
 const ox=[-1,1,0,0][w],oy=[0,0,-1,1][w],tx=-oy,ty=ox,A=S2(px,py),bx=A.x+ox*h,by=A.y+oy*h;
 cx.save();cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(bx+tx*hw,by+ty*hw);cx.lineTo(bx-tx*hw,by-ty*hw);cx.closePath();cx.fillStyle=col;cx.fill();cx.strokeStyle='#0b0f14';cx.lineWidth=1.1*DPR;cx.lineJoin='round';cx.stroke();cx.restore();}
function angOf(a,kind){const s=a.sh[kind]||a.sh.act||a.sh.rec;if(s)return s.s[0];return 0;}

function path(pts,col,dash){if(pts.length<2)return;cx.save();cx.strokeStyle=col;cx.lineWidth=2.2*DPR;cx.setLineDash(dash.map(v=>v*DPR));cx.globalAlpha=.95;cx.lineJoin='round';cx.beginPath();pts.forEach((p,i)=>{const q=S2(p[0],p[1]);i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y);});cx.stroke();cx.restore();}
function draw(){
 if(!G||SH<0)return;const a=LIST[SH];cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);table();
 // only the trajectory of the shot being viewed (실제/교정/추천), and only if its box is ticked
 const K=M.kind;if(K&&M.show[K]&&(K==='act'?a.tr:a.sh[K]))path(track(a,K).path,COL[K],K==='rec'?[8,5]:K==='fix'?[3,4]:[]);
 if(PTS&&K&&M.anim&&M.anim.t&&(K==='act'?a.tr:a.sh[K])){const t=M.anim.t();const tk=track(a,K);for(const e of tk.ev||[])if(e.t<=t)point(e.x,e.y,COL[K]);}
 {const ak=K&&a.sh[K]?K:'act';if(!M.anim||(M.anim.t&&M.anim.t()<0))aim(a.pre[a.cue],angOf(a,ak));}
 if(M.anim){const p=M.anim.pos();p.forEach((q,i)=>q&&ball(S2(q[0],q[1]),i));const c=M.anim.cue();if(c)cue(a.pre[a.cue],c.ang,c.gap,c.alpha);if(M.guide)guideCard(a,M.guide.kind,M.guide.alpha());}
 else{a.pre.forEach((q,i)=>ball(S2(q[0],q[1]),i));cue(a.pre[a.cue],angOf(a,K&&a.sh[K]?K:'act'),.05,.95);}
}
function plLive(k){document.querySelectorAll('.plays .pl').forEach(e=>e.classList.toggle('live',!!k&&e.classList.contains(k)));}
function stop(){cancelAnimationFrame(M.raf);M.anim=null;M.guide=null;M.mode='freeze';plLive(null);}
// 듣기 on: say the line first, then strike / 듣기 off: strike at once
function play(kind){
 const a=LIST[SH];if(!a||!a.sh[kind])return;stop();closeBig();M.kind=kind;plLive(kind);document.querySelectorAll('#sTips .tipc').forEach(e=>e.classList.remove('on'));
 const t=sayLines(a)[kind],tok=M.tok=(M.tok||0)+1;
 if(SAY_ON&&t&&'speechSynthesis' in window){draw();let go=false;const start=()=>{if(go||M.tok!==tok)return;go=true;strike(kind);};
  sayFor(kind,start);setTimeout(start,t.length*180+2500);return;}
 strike(kind);
}
function strike(kind){
 const a=LIST[SH];if(!a||!a.sh[kind])return;cancelAnimationFrame(M.raf);const tr=track(a,kind),ang=angOf(a,kind),PRE=1.6,STK=.75,ST=PRE+STK,t0=performance.now(),rate=+$('rate').value;
 const el0=()=>(performance.now()-t0)/1000*rate,el=()=>Math.max(0,el0()-PRE);
 M.guide={kind,alpha:()=>{const e=el0();return e<.25?e/.25:e<ST+.5?1:Math.max(0,1-(e-ST-.5)/.4);}};
 M.anim={t:()=>el0()-ST,pos:()=>tr.pos(clamp(el0()-ST,0,tr.dur)),cue:()=>{const e=el();if(e<.25)return {ang,gap:.05,alpha:1};if(e<.6){const u=(e-.25)/.35;return {ang,gap:.05+.17*Math.sin(u*Math.PI/2),alpha:1};}
  if(e<STK){const u=(e-.6)/(STK-.6);return {ang,gap:.22-.22*u*u,alpha:1};}const f=e-STK;return f<.45?{ang,gap:-.06*Math.min(1,f/.12),alpha:1-f/.45}:null;}};
 M.mode='sim';const tick=()=>{draw();if(el0()<tr.dur+ST+.3)M.raf=requestAnimationFrame(tick);else{M.mode='end';plLive(null);if(AUTO)autoGo(kind);}};tick();
}
function _unusedVideoLink(){const a=LIST[SH],t=Math.max(0,Math.floor(a.t0-2)),u=G.yt;if(!u)return;
 let url=u;if(/youtu\.?be/.test(u)){url=u.replace(/([?&])t=\d+s?/,'$1').replace(/[?&]$/,'');url+=(url.includes('?')?'&':'?')+'t='+t;}else url=u.split('#')[0]+'#t='+t;window.open(url,'_blank','noopener');}

/* ---------- wiring ---------- */
function tgUI(){for(const [id,on] of [['tPts',PTS],['tGrid',GRID]]){const b=$(id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);}}
$('tPts').onclick=()=>{PTS=!PTS;try{localStorage.setItem('3q-pts',PTS?'1':'0');}catch(e){}tgUI();if(M.mode!=='sim')draw();};
$('tGrid').onclick=()=>{GRID=!GRID;try{localStorage.setItem('3q-grid',GRID?'1':'0');}catch(e){}tgUI();if(M.mode!=='sim')draw();};tgUI();
for(const k of ['rec','act','fix']){$('b_'+k).onclick=()=>play(k);$('c_'+k).onchange=e=>{M.show[k]=e.target.checked;e.target.closest('.pl').classList.toggle('on',e.target.checked);if(M.mode!=='sim')draw();};}
$('bPrev').onclick=()=>openShot(SH-1);$('bNext').onclick=()=>openShot(SH+1);$('bBack').onclick=()=>{stop();stopSay();show('scHome');};
cv.addEventListener('click',()=>{if(M.mode!=='freeze'){stop();draw();}});
// quick shot seek bar under the table (replaces swiping)
$('sSeek').oninput=e=>{const k=+e.target.value;if(k===SH)return;if(AUTO){AUTOT++;stop();stopSay();openShot(k);autoGo(null);}else openShot(k);};
// 자동: 실제 → 교정 → 추천 for each shot, then the next shot, until the last one
var AUTO=false,AUTOT=0;
function autoUI(){const b=$('bAuto');b.classList.toggle('on',AUTO);b.setAttribute('aria-pressed',AUTO);b.textContent=AUTO?'⏸ 자동':'▶ 자동';}
function autoOff(){if(!AUTO)return;AUTO=false;AUTOT++;autoUI();}
function autoKinds(){const a=LIST[SH];return a?['act','fix','rec'].filter(k=>a.sh&&a.sh[k]&&!$('b_'+k).disabled&&(k!=='act'||a.tr)):[];}
function autoGo(after){if(!AUTO)return;const tok=AUTOT,ks=autoKinds(),i=after?ks.indexOf(after)+1:0;
 if(i<ks.length){setTimeout(()=>{if(AUTO&&tok===AUTOT)play(ks[i]);},after?900:300);return;}
 if(SH<LIST.length-1){setTimeout(()=>{if(!AUTO||tok!==AUTOT)return;openShot(SH+1);autoGo(null);},1300);return;}
 autoOff();}
$('bAuto').onclick=()=>{if(AUTO){autoOff();stop();stopSay();draw();return;}AUTO=true;AUTOT++;autoUI();autoGo(null);};
for(const id of ['b_act','b_fix','b_rec','bBack']){const f=$(id).onclick;$(id).onclick=e=>{autoOff();f&&f(e);};}
// 이전 · 다음 while 자동: go there and carry on from 실제, like the seek bar
for(const id of ['bPrev','bNext']){const f=$(id).onclick;$(id).onclick=e=>{if(!AUTO){f&&f(e);return;}AUTOT++;stop();stopSay();const k=SH;f&&f(e);if(SH!==k)autoGo(null);else autoOff();};}
cv.addEventListener('click',()=>autoOff());
addEventListener('resize',()=>{if(!$('scShot').hidden){resize();draw();}});
$('lgForm').onsubmit=e=>{e.preventDefault();login($('lgCode').value,$('lgPin').value,$('lgKeep').checked);};
$('bLogout').onclick=()=>{try{localStorage.removeItem('3q-member');}catch(e){}if(DATA0)return;stop();stopSay();D=null;$('bLogout').textContent='로그아웃';show('scLogin');};
(function boot(){
 if(DATA0){$('bLogout').hidden=true;start(DATA0);return;}
 const q=new URLSearchParams(location.search);if(q.get('code'))$('lgCode').value=q.get('code');
 let s=null;try{s=JSON.parse(localStorage.getItem('3q-member')||'null');}catch(e){}
 if(DEMO&&!q.get('code')&&!(s&&s.code&&s.pin)){$('bLogout').textContent='회원 로그인';start(DEMO);return;}
 if(s&&s.code&&s.pin){$('lgCode').value=s.code;$('lgPin').value=s.pin;$('lgKeep').checked=true;login(s.code,s.pin,true);}
 show(D?'scHome':'scLogin');
})();
window.M3Q={get D(){return D;},openGame,openShot,play,M};
