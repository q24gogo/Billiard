<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#0a1018"><title>3Q 코칭 · 회원</title>
<link rel="icon" type="image/png" href="./coach-192.png"><link rel="apple-touch-icon" href="./coach-192.png">
<style>
:root{--bg:#0a1018;--panel:#111a25;--line:#22313f;--text:#e9eef5;--muted:#8ea0b2;--mint:#6ff0c2;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0a1018ee;backdrop-filter:blur(6px);z-index:5}
.brand{display:flex;gap:7px;align-items:center}.logo{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;font-weight:900;border-radius:8px;padding:2px 7px;box-shadow:0 0 12px #38bdf866}
button,select,input{font:inherit;color:inherit}
button,select{background:#162231;border:1px solid var(--line);border-radius:10px;min-height:42px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}.sm{min-height:34px;padding:4px 10px;font-size:13px}.ghost{background:transparent}
.primary{background:var(--blue);border-color:var(--blue);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
h1{font-size:22px;margin:4px 0}h2{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:12px;margin:2px 0 0;text-align:center}
.login{max-width:420px;margin:40px auto}.login form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.login input:not([type=checkbox]){background:#0b131c;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
.login .keep{flex-direction:row;align-items:center;gap:8px}.msg{color:#ff9aa0;min-height:1.2em;margin:0}
.pname{font-size:24px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kpi{background:#0e1722;border:1px solid var(--line);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column}
.kpi span{font-size:12px;color:var(--muted)}.kpi b{font-size:21px}.kpi i{font-style:normal;font-size:12px;color:var(--muted)}.kpi small{font-size:13px;color:var(--muted)}
.types{width:100%;border-collapse:collapse;font-size:14px}.types td,.types th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.types th{color:var(--muted);font-weight:600;font-size:12px}
.bar{display:inline-block;width:80px;height:8px;background:#ffffff1c;border-radius:4px;vertical-align:middle;margin-right:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint)}
.game{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;margin:0 0 8px;padding:11px 13px;border-radius:12px}
.gl{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}.res.W{color:var(--mint);font-weight:800}.res.L{color:#ff8a8a;font-weight:800}
.bar1{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.stagebox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#cv{display:block;width:100%;touch-action:pan-y}
.tags{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.tag{background:#0a1018d9;border:1px solid #c79a3c;color:#ffd58a;border-radius:8px;padding:2px 8px;font-size:12.5px}.tag.tech{border-color:#2c4a68;color:#bfe6ff}
.ctrl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row4{display:grid;grid-template-columns:1fr auto 1fr .8fr;gap:8px;align-items:center}.pos{color:var(--muted);font-size:13px;text-align:center;min-width:54px}
.plays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pl{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0e1722}
.pl button{flex:1;border:0;border-radius:0;background:transparent;font-weight:700}
.pl .ck{display:flex;align-items:center;justify-content:center;width:44px;border-left:1px solid var(--line);cursor:pointer}.pl .ck input{display:none}
.pl .ck i{width:16px;height:16px;border-radius:4px;border:2px solid currentColor}.pl.on .ck i{background:currentColor;box-shadow:inset 0 0 0 2px #0e1722}
.pl.rec{color:#6ff0c2}.pl.act{color:#ffd166}.pl.fix{color:#ff9ad5}
.pl{transition:border-color .15s,box-shadow .15s}.pl.live{border-color:currentColor;box-shadow:0 0 0 1px currentColor,0 0 12px -2px currentColor}
#gTitle .op{color:#7f8d9b;font-weight:600}#gTitle .me{color:#fff}
.vid{background:#1b1730;border-color:#3b2f66}
.story p{margin:0 0 8px}.fixT{color:#ffc2e6}.recT{color:#b4f7dc}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.tipc{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12.5px;gap:2px;background:#0e1722;border:1px solid var(--line);border-radius:12px;padding:8px}
.tipc canvas{width:64px;height:64px}.tipc b{font-size:13px}.tipc.rec b{color:#6ff0c2}.tipc.act b{color:#ffd166}.tipc.fix b{color:#ff9ad5}
@media(min-width:700px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
/* v1.10 home / shot / cumulative */
.hello{padding:14px 4px 4px}.hello .pname{font-size:26px}
h3.sub{font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.glist{list-style:none;margin:0;padding:0;counter-reset:g}
.glist li{counter-increment:g}
.glist button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;margin:0 0 8px;padding:10px 12px;border-radius:12px;min-height:52px}
.glist button::before{content:counter(g)'.';color:var(--muted);font-weight:700;min-width:18px}
.gl1{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.gl1 b{font-size:15px}.gl1 .gm{font-size:13.5px;color:#cdd7e2}.gl1 .gt{font-size:12px;color:var(--muted)}
.glist button{border:1.5px solid #34506e;background:#111c29}.glist button:active{border-color:var(--mint)}

.gvid{flex:none;align-self:center;padding:8px 13px;border-radius:10px;background:#173a33;border:1px solid #2f7d68;color:var(--mint);font-weight:800;font-size:14px;white-space:nowrap}
.res.W{color:var(--mint);font-weight:800}.res.L{color:#ff8a8a;font-weight:800}.res.D{color:var(--muted);font-weight:800}
.cum{width:100%;margin-top:12px;background:#14243a;border-color:#2b4a72;font-weight:700}
.tips{margin-top:10px}
.say h2{margin:0}.sayh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#sSay p{margin:0 0 7px;font-size:16px;line-height:1.55}#sSay .lb{display:inline-block;min-width:64px;font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;text-align:center;vertical-align:1px}
#sSay .why .lb{background:#3a2430;color:#ffb3c1}#sSay .fix .lb{background:#3a2440;color:#ff9ad5}#sSay .rec .lb{background:#163a31;color:#6ff0c2}
#sSay p.speaking{color:#fff;text-shadow:0 0 10px #6ff0c255}
.story{font-size:13.5px;color:#c4cfdb}.story p{margin:0 0 6px}
.cum-dlg{width:min(860px,96vw);max-height:92vh;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:0}
.cum-dlg::backdrop{background:#000b}.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dh h2{margin:0}#cumBody{padding:12px 16px 18px}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--muted);font:11px system-ui}.chart .lab{fill:var(--text);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:4px 0 8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wl{display:flex;gap:4px;flex-wrap:wrap}.wl span{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.wl .W{background:#163a31;color:var(--mint)}.wl .L{background:#3a2026;color:#ff9aa0}.wl .D{background:#222c36;color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:#0a1018f2;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;z-index:20;white-space:nowrap}
.demo{font-size:11.5px;color:#ffd58a;margin:0 0 8px}
.tags{position:static;display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px;pointer-events:auto;align-items:center}
.tags{flex-wrap:nowrap}.tags .tag{white-space:nowrap}#sTech{min-width:0;overflow:hidden;text-overflow:ellipsis}.tgls{flex:none}
.seekS{margin:8px 2px 2px}#sSeek{width:100%;margin:0;accent-color:var(--mint);height:22px}
.auto{font-weight:800;color:var(--mint);border-color:#2f7d68;background:#132a26}.auto.on{background:var(--mint);color:#04140c;border-color:var(--mint)}
.tgls{margin-left:auto;display:flex;gap:6px}.tg{display:inline-flex;align-items:center;min-height:28px;padding:2px 10px;font-size:12.5px;border-radius:999px;background:#0e1722;border:1px solid #2a3b4e;color:var(--muted);font-weight:700}.tg::before{content:'';display:inline-block;width:11px;height:11px;margin-right:5px;border-radius:3px;border:1.6px solid currentColor;vertical-align:-1px}.tg.on{color:#dff;border-color:#3d6ea6;background:#14243a}.tg.on::before{content:'✓';border-color:var(--mint);background:var(--mint);color:#04140c;font-size:10px;line-height:10px;text-align:center;font-weight:900}
.tipc{cursor:pointer;transition:background .15s}.tipc .tt{display:flex;flex-direction:column;gap:2px}
.tipc.big{grid-column:1/-1;flex-direction:row;align-items:center;text-align:left;gap:14px;padding:12px}
.tipc.big .tt{font-size:14px;gap:4px}.tipc.big b{font-size:16px}.tipc.big .dl{color:#fff;font-weight:600}
.tipc.big.fix{border-color:#ff9ad566;background:#1d1424}.tipc.big.rec{border-color:#6ff0c266;background:#10201c}
.lg{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}.lg i{display:inline-block;width:11px;height:11px;border-radius:50%}
.lg i.g{border:2px dashed #ffd166}.lg i.n.fix{background:#ff9ad5}.lg i.n.rec{background:#6ff0c2}
.tipc.on{outline:2px solid currentColor}.tipc.act{color:#ffd166}.tipc.fix{color:#ff9ad5}.tipc.rec{color:#6ff0c2}.tipc span{color:var(--text)}
.tipbig{display:flex;align-items:center;gap:14px;margin-top:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#0e1722;cursor:pointer}
.tipbig[hidden]{display:none}.tipbig .tt{display:flex;flex-direction:column;gap:4px;font-size:14px}.tipbig b{font-size:16px}.tipbig .dl{color:#fff;font-weight:600}
.tipbig.fix{border-color:#ff9ad566;background:#1d1424}.tipbig.fix b{color:#ff9ad5}.tipbig.rec{border-color:#6ff0c266;background:#10201c}.tipbig.rec b{color:#6ff0c2}.tipbig.act b{color:#ffd166}
/* v1.14 */
#sSay .why .lb{background:#3a3218;color:#ffd166}
#sSay p,#sBody p{transition:color .2s,opacity .2s}#sSay p{opacity:.8}#sSay p.speaking{opacity:1}
#bSay.off{opacity:.65}
.story{font-size:15px;color:var(--text)}.story h2{margin:0}.story p{margin:0 0 8px;line-height:1.6}#sBody p.speaking{color:#fff;text-shadow:0 0 10px #6ff0c255}
.stagebox{position:relative}

.tipover[hidden]{display:none}.tipover .tt{display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}.tipover b{font-size:17px}
.tipover.act b{color:#ffd166}.tipover.fix b{color:#ff9ad5}.tipover.rec b{color:#6ff0c2}.tipover .dl{color:#fff;font-weight:600}.small2{font-size:11px}
#gTitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#gTitle .sep{color:var(--muted);font-weight:400}#gTitle .sc{color:#6fa8ff}#gTitle .fl{color:#ff7a7a}
/* v1.15 */
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.row3{display:flex;gap:6px}
.prac{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;background:#1a1d10;border:1px solid #4a4a22;color:#ffe08a;border-radius:10px;padding:6px 10px;cursor:pointer}
.prac input{width:18px;height:18px;accent-color:#ffd166}
.detailb{width:100%;background:transparent;border:1px dashed var(--line);font-weight:700}
#sBody{margin-top:10px}.small3{font-size:12px;margin:6px 0}
.cmpT{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}.cmpT td,.cmpT th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}.cmpT th{color:var(--muted);font-weight:600}
.cmpT tr.act td:first-child{color:#ffd166;font-weight:700}.cmpT tr.fix td:first-child{color:#ff9ad5;font-weight:700}.cmpT tr.rec td:first-child{color:#6ff0c2;font-weight:700}
.praclist{list-style:none;margin:0;padding:0}.praclist li{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#0e1722}
.praclist canvas{width:120px;height:66px;border-radius:6px;flex:none}.praclist .pp{font-size:12px;color:#cdd7e2;margin-top:3px;line-height:1.45}
.seg{display:flex;align-items:center;gap:4px}.seg button{min-height:32px;padding:3px 10px;font-size:12.5px;border-radius:8px}.seg button.on{background:#24466e;border-color:#3d6ea6;color:#fff;font-weight:700}
</style></head><body>
<header class="top"><div class="brand"><span class="logo">3Q</span><b>코칭</b><span class="muted">회원</span></div><button id="bLogout" class="ghost sm">로그아웃</button></header>
<main>
<section id="scLogin" class="card login" hidden>
 <h1>내 3쿠션 코칭</h1>
 <form id="lgForm"><label>회원코드<input id="lgCode" autocomplete="username" autocapitalize="characters" required></label>
  <label>PIN<input id="lgPin" type="password" inputmode="text" autocomplete="current-password" required></label>
  <label class="keep"><input id="lgKeep" type="checkbox" checked> 이 기기에서 로그인 유지</label>
  <button class="primary">보기</button><p id="lgMsg" class="msg"></p></form>
</section>
<section id="scHome" hidden>
 <div class="hello"><div class="pname" id="hName"></div><div class="muted" id="hSub"></div></div>
 <div class="card"><h2 id="todayT">오늘의 경기</h2><ol class="glist" id="games"></ol><div id="pastBox" hidden><h3 class="sub">지난 경기</h3><ol class="glist" id="past"></ol></div></div>
 <div class="card"><h2 id="anaT">샷 분석 · 오늘</h2><table class="types" id="types"></table>
  <button id="bCum" class="cum">📈 누적 분석 보기</button></div>
 <div class="card" id="pracBox" hidden><h2>🎯 연습샷 <span class="muted" id="pracN"></span></h2><p class="muted small3">구장에서 공을 놓을 위치(샷 전, 포인트 단위: 가로는 왼쪽 단쿠션부터 0~8, 세로는 위 장쿠션부터 0~4)</p><ul class="praclist" id="pracList"></ul></div>
</section>
<section id="scShot" hidden>
 <div class="bar1"><button id="bBack" class="sm">◀ 이전</button><b id="gTitle"></b></div>
 <div class="tags"><span class="tag" id="sHead"></span><span class="tag tech" id="sTech" hidden></span><span class="tgls"><button id="tPts" class="tg">포인트</button><button id="tGrid" class="tg">격자</button></span></div>
 <div class="stagebox"><canvas id="cv"></canvas><div class="tipover" id="tipOver" hidden></div></div>
 <div class="seekS"><input id="sSeek" type="range" min="0" max="0" step="1" value="0" aria-label="샷 빠른 이동"></div>
 <div class="ctrl">
  <div class="row4"><button id="bPrev">◀ 이전</button><span id="sPos" class="pos"></span><button id="bNext">다음 ▶</button><button id="bAuto" class="auto" aria-pressed="false">▶ 자동</button><input type="hidden" id="rate" value="1"></div>
  <div class="plays">
   <div class="pl act"><button id="b_act">▶ 실제</button><label class="ck"><input type="checkbox" id="c_act"><i></i></label></div>
   <div class="pl fix"><button id="b_fix">▶ 교정</button><label class="ck"><input type="checkbox" id="c_fix"><i></i></label></div>
   <div class="pl rec"><button id="b_rec">▶ 추천</button><label class="ck"><input type="checkbox" id="c_rec"><i></i></label></div>
  </div>
  <div class="row2"><label class="prac"><input type="checkbox" id="cPrac"> 🎯 연습샷 등록</label><div class="seg" id="clothSeg" role="group" aria-label="테이블 색"><span class="muted small">테이블</span><button data-c="def">기본</button><button data-c="blue">파랑</button><button data-c="green">초록</button></div></div>
 </div>
 <div class="tips" id="sTips"></div>
 <div class="card say"><div class="sayh"><h2>🎧 코칭 멘트</h2><div class="row3"><button id="bSay" class="sm">🔊 듣기</button></div></div><div id="sSay"></div></div>
 <div class="card story"><button id="bDetail" class="detailb">📋 자세한 설명 보기 ▼</button><div id="sBody" hidden></div></div>
</section>
</main>
<dialog id="cumDlg" class="cum-dlg"><div class="dh"><h2>📈 누적 분석</h2><button id="cumX" class="sm ghost" aria-label="닫기">✕</button></div><div id="cumBody"></div></dialog>

<script>
function createPhysics(){
 'use strict';
 const W=2.84,H=1.42,R=.03075,D=2*R,G=9.81;
 const BASE=Object.freeze({slide:.20,roll:.012,railE:.82,railMu:.14,ballE:.96,spinDecay:.45,railRoll:.9});
 const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));
 function validate(p){
  return Array.isArray(p)&&p.length===3&&p.every(a=>a&&Number.isFinite(a.x)&&Number.isFinite(a.y)&&a.x>=R+.001&&a.x<=W-R-.001&&a.y>=R+.001&&a.y<=H-R-.001)&&p.every((a,i)=>p.every((b,j)=>i===j||Math.hypot(a.x-b.x,a.y-b.y)>=D+.005));
 }
 // Same chronological rule as v3.6: freeze at SECOND DISTINCT object, not later rails.
 function ruleAtSecond(events){
  let cushions=0;const hit=new Set();
  for(const e of events){
   if(e.type==='cushion')cushions++;
   if(e.type==='ball'){
    hit.add(e.target);
    if(hit.size===2)return {score:cushions>=3,cushions,objects:[...hit],t:e.t};
   }
  }
  return {score:false,cushions,objects:[...hit],t:null};
 }
 function friction(b,h,cfg){
  const fullStep=h;
  const sx=b.vx-R*b.wy,sy=b.vy+R*b.wx,slip=Math.hypot(sx,sy);
  if(slip>.001){
   const ht=Math.min(h,slip/(3.5*cfg.slide*G)),factor=cfg.slide*G*ht/slip;
   const jx=-factor*sx,jy=-factor*sy;
   b.vx+=jx;b.vy+=jy;b.wx+=2.5*jy/R;b.wy-=2.5*jx/R;
   h-=ht;
  }
  if(h>1e-9){
   const speed=Math.hypot(b.vx,b.vy),k=speed>0?Math.max(0,1-cfg.roll*G*h/speed):0;
   b.vx*=k;b.vy*=k;b.wx=-b.vy/R;b.wy=b.vx/R;
  }
  b.wz*=Math.max(0,1-cfg.spinDecay*fullStep);
  if(Math.hypot(b.vx,b.vy)<.001&&Math.hypot(b.wx,b.wy)*R<.001){b.vx=b.vy=b.wx=b.wy=0;}
 }
 function simulate(pos,shot,opts={}){
  const cfg={...BASE,...(opts.model||{})},step=opts.dt||.02,maxC=opts.maxC||5,record=!!opts.record,maxT=opts.maxT||18;
  const balls=pos.map(p=>({x:p.x,y:p.y,vx:0,vy:0,wx:0,wy:0,wz:0}));
  const cb=balls[0],dx=Math.cos(shot.angle),dy=Math.sin(shot.angle),speed=shot.speed;

 const t=sayLines(a)[kind],tok=M.tok=(M.tok||0)+1;
 if(SAY_ON&&t&&'speechSynthesis' in window){draw();let go=false;const start=()=>{if(go||M.tok!==tok)return;go=true;strike(kind);};
  sayFor(kind,start);setTimeout(start,t.length*180+2500);return;}
 strike(kind);
}
function strike(kind){
 const a=LIST[SH];if(!a||!a.sh[kind])return;cancelAnimationFrame(M.raf);const tr=track(a,kind),ang=angOf(a,kind),PRE=1.6,STK=.75,ST=PRE+STK,t0=performance.now(),rate=+$('rate').value;
 const el0=()=>(performance.now()-t0)/1000*rate,el=()=>Math.max(0,el0()-PRE);
 M.guide={kind,alpha:()=>{const e=el0();return e<.25?e/.25:e<ST+.5?1:Math.max(0,1-(e-ST-.5)/.4);}};
 M.anim={t:()=>el0()-ST,pos:()=>tr.pos(clamp(el0()-ST,0,tr.dur)),cue:()=>{const e=el();if(e<.25)return {ang,gap:.05,alpha:1};if(e<.6){const u=(e-.25)/.35;return {ang,gap:.05+.17*Math.sin(u*Math.PI/2),alpha:1};}
  if(e<STK){const u=(e-.6)/(STK-.6);return {ang,gap:.22-.22*u*u,alpha:1};}const f=e-STK;return f<.45?{ang,gap:-.06*Math.min(1,f/.12),alpha:1-f/.45}:null;}};
 M.mode='sim';const tick=()=>{draw();if(el0()<tr.dur+ST+.3)M.raf=requestAnimationFrame(tick);else{M.mode='end';plLive(null);if(AUTO)autoGo(kind);}};tick();
}
function _unusedVideoLink(){const a=LIST[SH],t=Math.max(0,Math.floor(a.t0-2)),u=G.yt;if(!u)return;
 let url=u;if(/youtu\.?be/.test(u)){url=u.replace(/([?&])t=\d+s?/,'$1').replace(/[?&]$/,'');url+=(url.includes('?')?'&':'?')+'t='+t;}else url=u.split('#')[0]+'#t='+t;window.open(url,'_blank','noopener');}

/* ---------- wiring ---------- */
function tgUI(){for(const [id,on] of [['tPts',PTS],['tGrid',GRID]]){const b=$(id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);}}
$('tPts').onclick=()=>{PTS=!PTS;try{localStorage.setItem('3q-pts',PTS?'1':'0');}catch(e){}tgUI();if(M.mode!=='sim')draw();};
$('tGrid').onclick=()=>{GRID=!GRID;try{localStorage.setItem('3q-grid',GRID?'1':'0');}catch(e){}tgUI();if(M.mode!=='sim')draw();};tgUI();
for(const k of ['rec','act','fix']){$('b_'+k).onclick=()=>play(k);$('c_'+k).onchange=e=>{M.show[k]=e.target.checked;e.target.closest('.pl').classList.toggle('on',e.target.checked);if(M.mode!=='sim')draw();};}
$('bPrev').onclick=()=>openShot(SH-1);$('bNext').onclick=()=>openShot(SH+1);$('bBack').onclick=()=>{stop();stopSay();show('scHome');};
cv.addEventListener('click',()=>{if(M.mode!=='freeze'){stop();draw();}});
// quick shot seek bar under the table (replaces swiping)
$('sSeek').oninput=e=>{const k=+e.target.value;if(k===SH)return;if(AUTO){AUTOT++;stop();stopSay();openShot(k);autoGo(null);}else openShot(k);};
// 자동: 실제 → 교정 → 추천 for each shot, then the next shot, until the last one
var AUTO=false,AUTOT=0;
function autoUI(){const b=$('bAuto');b.classList.toggle('on',AUTO);b.setAttribute('aria-pressed',AUTO);b.textContent=AUTO?'⏸ 자동':'▶ 자동';}
function autoOff(){if(!AUTO)return;AUTO=false;AUTOT++;autoUI();}
function autoKinds(){const a=LIST[SH];return a?['act','fix','rec'].filter(k=>a.sh&&a.sh[k]&&!$('b_'+k).disabled&&(k!=='act'||a.tr)):[];}
function autoGo(after){if(!AUTO)return;const tok=AUTOT,ks=autoKinds(),i=after?ks.indexOf(after)+1:0;
 if(i<ks.length){setTimeout(()=>{if(AUTO&&tok===AUTOT)play(ks[i]);},after?900:300);return;}
 if(SH<LIST.length-1){setTimeout(()=>{if(!AUTO||tok!==AUTOT)return;openShot(SH+1);autoGo(null);},1300);return;}
 autoOff();}
$('bAuto').onclick=()=>{if(AUTO){autoOff();stop();stopSay();draw();return;}AUTO=true;AUTOT++;autoUI();autoGo(null);};
for(const id of ['b_act','b_fix','b_rec','bBack']){const f=$(id).onclick;$(id).onclick=e=>{autoOff();f&&f(e);};}
// 이전 · 다음 while 자동: go there and carry on from 실제, like the seek bar
for(const id of ['bPrev','bNext']){const f=$(id).onclick;$(id).onclick=e=>{if(!AUTO){f&&f(e);return;}AUTOT++;stop();stopSay();const k=SH;f&&f(e);if(SH!==k)autoGo(null);else autoOff();};}
cv.addEventListener('click',()=>autoOff());
addEventListener('resize',()=>{if(!$('scShot').hidden){resize();draw();}});
$('lgForm').onsubmit=e=>{e.preventDefault();login($('lgCode').value,$('lgPin').value,$('lgKeep').checked);};
$('bLogout').onclick=()=>{try{localStorage.removeItem('3q-member');}catch(e){}if(DATA0)return;stop();stopSay();D=null;$('bLogout').textContent='로그아웃';show('scLogin');};
(function boot(){
 if(DATA0){$('bLogout').hidden=true;start(DATA0);return;}
 const q=new URLSearchParams(location.search);if(q.get('code'))$('lgCode').value=q.get('code');
 let s=null;try{s=JSON.parse(localStorage.getItem('3q-member')||'null');}catch(e){}
 if(DEMO&&!q.get('code')&&!(s&&s.code&&s.pin)){$('bLogout').textContent='회원 로그인';start(DEMO);return;}
 if(s&&s.code&&s.pin){$('lgCode').value=s.code;$('lgPin').value=s.pin;$('lgKeep').checked=true;login(s.code,s.pin,true);}
 show(D?'scHome':'scLogin');
})();
window.M3Q={get D(){return D;},openGame,openShot,play,M};

<script id="q24land-js">

addEventListener('popstate',function(){if(full){dropFull(true);apply();}});
['fullscreenchange','webkitfullscreenchange'].forEach(function(n){document.addEventListener(n,function(){if(fsMine&&!fsEl()){fsMine=false;fsDeclined=true;if(full)exitFull();}});});
var rT=0;function onResize(){if(selfFire)return;clearTimeout(rT);rT=setTimeout(apply,80);}
addEventListener('resize',onResize);addEventListener('orientationchange',onResize);if(window.visualViewport)visualViewport.addEventListener('resize',onResize);
