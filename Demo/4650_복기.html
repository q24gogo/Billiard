function segAt(t){let lo=0,hi=segs.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(segs[m].st<=t)lo=m;else hi=m-1;}return lo;}

 ctx.fillStyle='#e9eef5';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(txt,x+pad,y+fs*.85+.5);ctx.restore();
 const done=st.k===segs.length-1&&segs[st.k].i===SH.length-1&&$('flt').value==='all';
 if(st.post>=0){const u=st.post,a=clamp(u/.2,0,1)*(done?1:clamp((st.g.post-u)/.25,0,1));if(a<=0)return;
  const [cx,cy]=VERT?[TX+VH/2,TY+VW/2]:[TX+VW/2,TY+VH/2],big=Math.max(22*DPR,Math.min(52*DPR,.11*M));
  let msg=s.sc?'득점!':'실패',col=s.sc?'#5fe3b4':'#f5c16a',sub2=`${s.A.sc[0]} : ${s.A.sc[1]}`;
  if(done){const w=FINAL[0]===FINAL[1]?-1:FINAL[0]>FINAL[1]?0:1;msg='경기 종료';col='#ffd23f';sub2=w<0?`${FINAL[0]} : ${FINAL[1]} 무승부`:`${PL[w].name} 승 · ${FINAL[0]} : ${FINAL[1]}`;}
  ctx.save();ctx.globalAlpha=a;ctx.font=`900 ${big}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${big*.36}px system-ui`;const w2=ctx.measureText(sub2).width;ctx.font=`900 ${big}px system-ui`;const bw=Math.max(ctx.measureText(msg).width,w2)+big*1.2;
  rrect(ctx,cx-bw/2,cy-big*.85,bw,big*2.1,big*.45);ctx.fillStyle=s.sc||done?'rgba(10,40,31,.88)':'rgba(48,36,16,.88)';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2*DPR;ctx.stroke();
  ctx.fillStyle=col;ctx.fillText(msg,cx,cy+1);ctx.font=`700 ${big*.36}px system-ui`;ctx.fillStyle='#e9eef5';ctx.fillText(sub2,cx,cy+big*.82);ctx.restore();}

function draw(){
 if(!W)return;const st=state(T);
 if(!tableCache)tableCache=buildTable();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=PAL.floor||'#0b121b';ctx.fillRect(0,0,W,H);

  if(st.phase==='pre'&&st.u>.3){const p=st.pos[cb],dx=Math.cos(s.ang),dy=Math.sin(s.ang);ctx.save();ctx.globalAlpha=.35*clamp((st.u-.3)/.3,0,1);ctx.strokeStyle='#fff';ctx.lineWidth=1*DPR;ctx.setLineDash([4*DPR,5*DPR]);

const frac8=c=>c==null?'—':Math.max(1,Math.min(8,Math.round(c*8)))+'/8';

 var cs=getComputedStyle(root),cw=root.clientWidth-px(cs.paddingLeft)-px(cs.paddingRight),ch=root.clientHeight-px(cs.paddingTop)-px(cs.paddingBottom),h=Math.floor(ch);
 // the table area: as tall as the screen, about 2/3 of the width (the side keeps at least ~1/4)
 var top=full?0:Math.round(Math.max(6,Math.min(12,h*.02))),th=h-top-1,side=full?0:Math.max(230,Math.min(320,cw*.27)),room=full?cw:cw-side-8,w=Math.floor(Math.min(room,th*1.8)),el=stageEl();
 window.Q24L={on:true,h:Math.floor(Math.min(th,w/1.8)+1),sb:REPLAY?sbC:null};
 root.style.setProperty('--q24top',top+'px');
 if(el)el.style.width=w+'px';L.style.width=full?'':w+'px';L.style.height=full?h+'px':(h-top)+'px';
}
function fire(){selfFire=true;try{window.dispatchEvent(new Event('resize'));}catch(e){}selfFire=false;}
// browser bars are hidden only in the full view; the standard view keeps them and never resizes on a tap
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
function fsReq(){var d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;if(!f||fsEl())return;try{var p=f.call(d,{navigationUI:'hide'});fsMine=true;if(p&&p.catch)p.catch(function(){fsMine=false;});}catch(e){fsMine=false;}}
function fsExit(){var x=document.exitFullscreen||document.webkitExitFullscreen;if(fsMine&&x&&fsEl()){try{var p=x.call(document);if(p&&p.catch)p.catch(function(){});}catch(e){}}fsMine=false;}
function dropFull(fromPop){if(!full)return;full=false;clearInterval(syncT);fsExit();if(!fromPop&&history.state&&history.state.q24full)history.back();}
function apply(){
 var w=want();
 if(w&&!on){on=true;build();document.body.classList.add('q24-land');}
 else if(!w&&on){dropFull(false);fsExit();fsDeclined=false;on=false;document.body.classList.remove('q24-land');unpark();var el=stageEl();if(el)el.style.width='';window.Q24L={on:false};}
 document.body.classList.toggle('q24-full',on&&full);
 if(on)size();
 fire();
}
function playing(){var b=$(SRC.play),t=b?b.textContent:'';return t.indexOf('⏸')>=0||t.indexOf('⏹')>=0;}
function sync(){var p=O.querySelector('[data-a=play]'),s=$(SRC.pos);p.textContent=playing()?'⏸':'▶';O.querySelector('.ps').textContent=s?(PCOACH?s.textContent.split(' · ')[0]:s.textContent):'';}
function wake(){O.classList.remove('dim');clearTimeout(dimT);dimT=setTimeout(function(){if(playing())O.classList.add('dim');},3000);}
function press(a){var b=$(SRC[a]);if(b&&!b.disabled)b.click();setTimeout(sync,60);}
function enterFull(){if(!on||full)return;full=true;try{history.pushState({q24full:1},'');}catch(e){}fsReq();apply();if(!playing())press('play');syncT=setInterval(sync,400);sync();wake();}
function exitFull(){dropFull(false);apply();}
O.querySelector('.bk').onclick=function(){exitFull();};
O.querySelectorAll('.rt button').forEach(function(b){b.onclick=function(){press(b.dataset.a);wake();};});
root.addEventListener('pointerdown',function(){wasDim=O.classList.contains('dim');wake();},true);
// in full view a tap on the table first brings the buttons back; a second tap pauses / resumes
L.addEventListener('click',function(e){if(!full)return;if(e.target.closest&&e.target.closest('.tipover'))return;e.stopPropagation();e.preventDefault();if(!wasDim)press('play');wake();},true);
if(COACH){var sx=0,sy=0;L.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
 L.addEventListener('touchend',function(e){var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){press(dx<0?'next':'prev');wake();}},{passive:true});}
addEventListener('popstate',function(){if(full){dropFull(true);apply();}});
['fullscreenchange','webkitfullscreenchange'].forEach(function(n){document.addEventListener(n,function(){if(fsMine&&!fsEl()){fsMine=false;fsDeclined=true;if(full)exitFull();}});});
var rT=0;function onResize(){if(selfFire)return;clearTimeout(rT);rT=setTimeout(apply,80);}
addEventListener('resize',onResize);addEventListener('orientationchange',onResize);if(window.visualViewport)visualViewport.addEventListener('resize',onResize);
if(mq.addEventListener)mq.addEventListener('change',onResize);else if(mq.addListener)mq.addListener(onResize);
if(COACH&&window.MutationObserver)new MutationObserver(function(){apply();}).observe($('scShot'),{attributes:true,attributeFilter:['hidden']});
apply();
})();
