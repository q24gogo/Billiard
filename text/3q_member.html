<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1018"><title>당구 교과서 · 중계듣기</title><style>
:root{--line:#22313f;--mint:#6ff0c2;--gold:#ffd166}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0a1018;color:#e9eef5;margin:0;padding:14px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 2px}.sub{color:#8ea0b2;font-size:13px;margin-bottom:10px}
#st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;background:#6e2b2b;vertical-align:3px;margin-left:6px}#st.on{background:#1a7f37}
.card{background:#111a25;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
input,button{font:inherit;color:inherit}button{background:#162231;border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.start{width:100%;font-size:19px;padding:15px;background:#2563eb;border-color:#2563eb;font-weight:800}.start.on{background:#14532d;border-color:#1a7f37}
#tbl{background:#0b131c;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:9em;font-size:17px;letter-spacing:1px}
#last{font-size:19px;line-height:1.6;min-height:3.2em;color:#9fb0c2}#last .c{color:#fff}#last .c.h{color:var(--gold);font-weight:800}
#head{color:var(--mint);font-weight:700;font-size:14px;margin-bottom:4px}
label{font-size:14px;color:#c4cfdb}.hint{color:#8ea0b2;font-size:12.5px}
input[type=range]{width:130px;accent-color:var(--mint)}
#log{height:120px;overflow:auto;background:#070b10;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:11.5px/1.5 ui-monospace,Consolas,monospace;color:#9fb0c2}
details summary{cursor:pointer;color:#8ea0b2;font-size:13px}
</style></head><body>
<h1>📘 당구 교과서 <span id="st">끊김</span></h1>
<div class="sub">TV의 코칭 멘트를 내 폰 → 블루투스 이어폰으로 듣기</div>
<div class="card">
 <button class="start" id="go">📡 중계듣기</button>
 <div class="hint" style="margin-top:8px">블루투스 이어폰을 폰에 먼저 연결한 뒤 누르세요. TV 당구 교과서의 코칭 멘트가 바로 들립니다.</div>
</div>
<div class="card"><div id="head">대기 중</div><div id="last">—</div></div>
<div class="card">
 <div class="row"><label>음량 <input type="range" id="vol" min="0.2" max="1" step="0.1" value="1"></label><label>속도 <input type="range" id="rate" min="0.8" max="1.6" step="0.1" value="1.1"></label></div>
 <div class="row"><label>앞 지연 <input type="range" id="lead" min="0" max="800" step="50" value="350"></label><span id="leadv" class="hint">350ms</span><span class="hint">(이어폰 첫 소리가 잘리면 늘리기)</span></div>
 <div class="row"><button id="tt">소리 테스트</button><label><input type="checkbox" id="keep" checked> 블루투스 유지음(화면 꺼짐·백그라운드에도 듣기)</label></div>
</div>
<details><summary>연결 정보 · 기록</summary><div class="row"><label>채널 <input id="tbl" size="8" autocapitalize="characters" autocomplete="off"></label><span class="hint">TV가 여러 대일 때만 바꾸기 (기본 Q24)</span></div><div class="row"><label>브로커 <input id="url" size="30"></label></div><div id="log"></div></details>
<script>
/* 초소형 MQTT 3.1.1 over WebSocket (QoS0) — Q24 판정 PC 시험 코드와 같은 방식 */
function MQ(url,onMsg,onState){
 let ws=null,timer=null,ping=null,buf=new Uint8Array(0),subs=[],alive=false,want=true;
 const enc=s=>{const b=new TextEncoder().encode(s);return [b.length>>8,b.length&255,...b];};
 const rl=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return o;};
 const pkt=(h,body)=>new Uint8Array([h,...rl(body.length),...body]);
 const send=p=>{if(ws&&ws.readyState===1)ws.send(p);};
 function parse(){while(buf.length>=2){let n=0,mul=1,i=1,ok=false;while(i<buf.length){const c=buf[i++];n+=(c&127)*mul;mul*=128;if(!(c&128)){ok=true;break;}}
   if(!ok||buf.length<i+n)return;const t=buf[0]>>4,body=buf.slice(i,i+n);buf=buf.slice(i+n);
   if(t===2){alive=true;onState&&onState('connected');subs.forEach(s=>sub(s,true));}
   else if(t===3){const L=(body[0]<<8)|body[1];onMsg(new TextDecoder().decode(body.slice(2,2+L)),new TextDecoder().decode(body.slice(2+L)));}}}
 function open(){if(!want)return;onState&&onState('connecting');
  try{ws=new WebSocket(url,'mqtt');}catch(e){onState&&onState('error');timer=setTimeout(open,3000);return;}
  ws.binaryType='arraybuffer';buf=new Uint8Array(0);
  ws.onopen=()=>send(pkt(0x10,[...enc('MQTT'),4,2,0,30,...enc('q24m-'+Math.random().toString(36).slice(2,10))]));
  ws.onmessage=e=>{const a=new Uint8Array(e.data),m=new Uint8Array(buf.length+a.length);m.set(buf);m.set(a,buf.length);buf=m;parse();};
  ws.onclose=ws.onerror=()=>{if(alive){alive=false;onState&&onState('disconnected');}clearInterval(ping);if(want){clearTimeout(timer);timer=setTimeout(open,3000);}};
  clearInterval(ping);ping=setInterval(()=>send(new Uint8Array([0xC0,0])),20000);}
 function sub(t,re){if(!re&&!subs.includes(t))subs.push(t);if(alive)send(pkt(0x82,[0,1,...enc(t),0]));}
 function pub(t,s){send(pkt(0x30,[...enc(t),...new TextEncoder().encode(s)]));}
 function close(){want=false;clearTimeout(timer);clearInterval(ping);try{ws&&ws.close();}catch(e){}}
 open();return {sub,pub,close,get ok(){return alive;}};}
const $=id=>document.getElementById(id),QP=new URLSearchParams(location.search),DEMO='wss://broker.emqx.io:8084/mqtt';
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}};
$('url').value=QP.get('b')||ls('3qm_url')||DEMO;$('tbl').value=(QP.get('t')||ls('3qm_tbl')||'Q24').toUpperCase();
['vol','rate','lead'].forEach(k=>{const v=ls('3qm_'+k);if(v)$(k).value=v;$(k).addEventListener('input',()=>{ls('3qm_'+k,$(k).value);$('leadv').textContent=$('lead').value+'ms';});});$('leadv').textContent=$('lead').value+'ms';
const log=s=>{const d=$('log');d.insertAdjacentHTML('beforeend',new Date().toLocaleTimeString()+' '+s.replace(/</g,'&lt;')+'<br>');d.scrollTop=1e9;};
const ME=ls('3qm_id')||('m'+Math.random().toString(36).slice(2,9));ls('3qm_id',ME);
let mq=null,keepEl=null,wake=null,hello=null,lastSeq=0;const T=s=>'q24text/'+($('tbl').value.trim().toUpperCase()||'Q24')+'/'+s;
/* ---- 음성 (이어 읽기) ---- */
let AC=null;window.__lastEnd=0;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function wakeTone(){try{const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=900;g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(.04,a.currentTime+.02);g.gain.linearRampToValueAtTime(0,a.currentTime+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.2);}catch(e){}}
const SPK=t=>String(t).replace(/(\d)\/8/g,'8분의 $1').replace(/[()]/g,' ');
function speak(t){try{const ss=window.speechSynthesis;if(!ss){log('⚠ 이 브라우저는 음성 출력이 안 됩니다(크롬·사파리 사용)');return;}try{ss.resume();}catch(e){}
 const idle=!ss.speaking&&Date.now()-window.__lastEnd>1500;let d=0;if(idle){d=Math.max(60,+$('lead').value||0);if(d>60)wakeTone();}
 setTimeout(()=>{const u=new SpeechSynthesisUtterance(SPK(t));u.lang='ko-KR';u.volume=+$('vol').value;u.rate=+$('rate').value;
  try{const ko=ss.getVoices().filter(v=>/^ko/i.test(v.lang));if(ko.length)u.voice=ko.find(v=>v.localService)||ko[0];}catch(e){}
  u.onend=()=>{window.__lastEnd=Date.now();};u.onerror=e=>{window.__lastEnd=Date.now();if(e.error!=='interrupted'&&e.error!=='canceled')log('⚠ 음성 오류: '+(e.error||'?'));};ss.speak(u);},d);}catch(e){log('⚠ '+e);}}
function silentWav(){const sr=8000,N=sr*10,n=N*2,b=new ArrayBuffer(44+n),d=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');d.setUint32(4,36+n,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n,true);
 for(let i=0;i<N;i++)d.setInt16(44+i*2,Math.round(80*Math.sin(2*Math.PI*50*i/sr)),true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
/* ---- 수신 ---- */
function onMsg(topic,msg){let o;try{o=JSON.parse(msg);}catch(e){return;}
 if(!topic.endsWith('/ai')||o.type!=='say'||!o.say)return;
 if(o.seq!=null){if(o.seq<=lastSeq&&lastSeq-o.seq<1e6)return;lastSeq=o.seq;}
 if(o.reset){try{speechSynthesis.cancel();}catch(e){}}
 if(o.head)$('head').textContent=o.head;
 const tx=(o.text||o.say).replace(/</g,'&lt;'),L=$('last');if(o.reset||L.dataset.n==null||+L.dataset.n>=40){L.innerHTML='';L.dataset.n=0;}L.querySelectorAll('span.c').forEach(e=>e.classList.remove('c'));L.insertAdjacentHTML('beforeend',(+L.dataset.n?' ':'')+'<span class="c'+(o.hl?' h':'')+'">'+tx+'</span>');L.dataset.n=+L.dataset.n+1;
 log('수신 '+Math.max(0,Date.now()-(o.at||Date.now()))+'ms: '+(o.text||o.say));speak(o.say);}
function sendHello(){if(mq&&mq.ok)mq.pub(T('m'),JSON.stringify({type:'hello',id:ME,at:Date.now()}));}
$('go').onclick=async()=>{const t=$('tbl').value.trim().toUpperCase()||'Q24';$('tbl').value=t;ls('3qm_tbl',t);ls('3qm_url',$('url').value.trim());
 ac();speak('연결합니다');
 if($('keep').checked){if(!keepEl){keepEl=Object.assign(new Audio(silentWav()),{loop:true,volume:.5});keepEl.setAttribute('playsinline','');keepEl.style.display='none';document.body.appendChild(keepEl);}keepEl.play().catch(()=>{});
  try{navigator.mediaSession.metadata=new MediaMetadata({title:'당구 교과서',artist:'코칭 멘트 대기 중'});navigator.mediaSession.playbackState='playing';['play','pause','stop'].forEach(a=>{try{navigator.mediaSession.setActionHandler(a,()=>{try{keepEl.play();}catch(e){}});}catch(e){}});}catch(e){}}
 try{wake=await navigator.wakeLock.request('screen');}catch(e){}
 if(mq)mq.close();lastSeq=0;
 mq=MQ($('url').value.trim(),onMsg,s=>{$('st').textContent=s==='connected'?'연결됨':s==='connecting'?'연결 중…':'끊김';$('st').className=s==='connected'?'on':'';
  if(s==='connected'){mq.sub(T('ai'));sendHello();log('연결: 채널 '+t);}});
 clearInterval(hello);hello=setInterval(sendHello,15000);
 $('go').textContent='● 중계 듣는 중 (다시 누르면 재연결)';$('go').classList.add('on');};
$('tt').onclick=()=>{ac();wakeTone();speak('소리 테스트입니다. 들리면 정상입니다.');};
document.addEventListener('visibilitychange',async()=>{if(!document.hidden){if(wake&&wake.released){try{wake=await navigator.wakeLock.request('screen');}catch(e){}}if(keepEl&&keepEl.paused&&$('keep').checked)keepEl.play().catch(()=>{});sendHello();}});
log('1) 블루투스 이어폰 연결 → 2) 📡 중계듣기');
</script></body></html>
